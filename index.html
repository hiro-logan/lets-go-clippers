<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cheer for Kawhi</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Arial', sans-serif;
      color: white;
      overflow-x: hidden;
    }

    .banner {
      font-size: 6vw;
      font-weight: bold;
      color: #facc15;
      margin: 20px 0;
      animation: wave 2s infinite linear;
      white-space: nowrap;
      text-align: center;
    }

    @keyframes wave {
      0% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      100% { transform: translateX(-10px); }
    }

    #videoContainer {
      display: none;
      width: 90%;
      max-width: 800px;
      height: 404px; /* 202px * 2 */
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    button {
      padding: 16px 28px;
      font-size: 5vw;
      background-color: #facc15;
      color: #1e3a8a;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
      transition: background-color 0.3s ease;
      margin-bottom: 30px;
    }

    button:hover {
      background-color: #fde047;
    }

    @media (min-width: 600px) {
      .banner {
        font-size: 36px;
      }

      button {
        font-size: 22px;
      }

      #videoContainer {
        height: 676px; /* 338px * 2 */
      }
    }
  </style>
</head>
<body>

  <div class="banner">🏀 LET'S GO CLIPPERS 🏀</div>

  <div id="videoContainer">
    <iframe id="kawhiVideo"
            src=""
            allow="autoplay; encrypted-media"
            allowfullscreen
            title="Kawhi Playoff Cheer Video">
    </iframe>
  </div>

  <button onclick="playVideo()" id="playBtn">🎉 Cheer for Kawhi in the Playoffs</button>

  <script>
    function playVideo() {
      const container = document.getElementById('videoContainer');
      const video = document.getElementById('kawhiVideo');
      const btn = document.getElementById('playBtn');

      video.src = "https://www.youtube.com/embed/fj01SwCgWg8?autoplay=1";
      container.style.display = 'block';
      btn.style.display = 'none';
    }
  </script>

</body>
</html>
